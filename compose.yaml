services:
  app:
    container_name: ai-learning-starmap
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: app-data
        target: /app/data
      - type: bind
        source: ${HOST_HOME:?Copy .env.example to .env and set HOST_HOME}/.gitconfig
        target: /run/host-gitconfig
        read_only: true
      - type: bind
        source: ${HOST_HOME:?Copy .env.example to .env and set HOST_HOME}/.ssh
        target: /run/host-ssh
        read_only: true

volumes:
  app-data:
    name: ai-learning-data
